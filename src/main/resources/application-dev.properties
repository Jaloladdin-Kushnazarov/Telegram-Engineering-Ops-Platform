# ===================================================================
# Phase 211 — DEV PROFILE konfiguratsiyasi
# ===================================================================
# Faqat lokal demo va developer onboarding uchun. Production'da
# SPRING_PROFILES_ACTIVE=dev NEVER set qilinmasin.
#
# Profile activation:
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev
# yoki:
#   SPRING_PROFILES_ACTIVE=dev java -jar target/*.jar
# ===================================================================

# Dev mode toggle — DevTokenIssuer, DevAuthController va
# DevBootstrapInitializer beans'larni yaratishni yoqadi. Property
# o'rnatilmagan (default) — barcha dev klasslari ContextLoad'ga ham
# kirmaydi, /api/dev/** → 404, production behavior 0 farq.
app.security.dev-mode.enabled=true

# HMAC HS256 secret — DEV ONLY. Production'da issuer-uri yoki
# jwk-set-uri ishlatiladi (Phase 125/137). Bu property
# JwtAuthenticationConfig'ning conditional hmacJwtDecoder bean'ini
# faollashtiradi va shu orqali /api/** + /web/api/** matcher'lari
# haqiqiy JWT validation bilan ishlay boshlaydi.
#
# Secret >= 32 byte bo'lishi shart (HS256 talabi). Mana shu satr
# 64 byte uzunlikda.
app.security.jwt.hmac-secret=dev-only-secret-do-not-use-in-production-min-32-bytes-required-for-hs256

# Dev infrastructure logging — bootstrap qadamlarini operator
# console'da osongina ko'rishi uchun INFO darajada.
logging.level.com.engops.platform.dev=INFO

# Phase 216 — bootstrap PLATFORM_OWNER role binding (dev mode only).
# Vergul bilan ajratilgan telegram_user_id ro'yxati. Har bir mavjud
# AppUser (findByTelegramUserId orqali) startup paytida PLATFORM_OWNER
# role binding'iga ega bo'ladi (app_user_role_binding jadvali, V9).
# Idempotent — existsByUserIdAndRoleId tekshiruvi orqali takror seed
# bo'lmaydi.
#
# Default: 100000001 (DevBootstrapInitializer.BOOTSTRAP_ADMIN_TELEGRAM_USER_ID).
# Bo'sh qiymat → hech kim seed qilinmaydi.
app.security.bootstrap.platform-owner-telegram-ids=100000001

# Phase 218a — Telegram Login Widget bot token (dev mode).
# Production'da: SPRING_APPLICATION_TELEGRAM_BOT_TOKEN env variable.
# Bo'sh qiymat → Telegram login disabled (dev token fallback ishlaydi).
# Bot token: BotFather'dan oling (https://t.me/BotFather → /newbot).
# Bot username: setdomain qilingan domain'da Login Widget ko'rinadi.
app.security.telegram.bot-token=8861253298:AAGvAy3Up2Sh_3iwsY8opQntP9fsuoN_ezY
app.security.telegram.bot-username=engops_platform_bot
