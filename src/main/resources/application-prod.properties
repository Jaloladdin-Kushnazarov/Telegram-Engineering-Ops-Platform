# ===================================================================
# Production profili — environment variable'lar orqali sozlanadi
# ===================================================================

# Baza ulanish ma'lumotlari muhit o'zgaruvchilaridan olinadi
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.hikari.maximum-pool-size=20

spring.jpa.show-sql=false

logging.level.root=WARN
logging.level.com.engops.platform=INFO
logging.level.org.hibernate.SQL=WARN

# --- Actuator hardening (Phase 188) ---------------------------------
# Prod profile faqat health/info/metrics endpoint'larini ochiq qiladi.
# Base application.properties'dagi `flyway` endpoint prod'da ataylab
# YO'Q — schema metadata (migration tarixi, joriy version) HTTP orqali
# qaytarilmaydi. Bu Phase 146 default-deny posture'ini kuchaytiradi.
management.endpoints.web.exposure.include=health,info,metrics

# `/actuator/health` javobida detail (komponentlar, DB ping, disk) ham
# ko'rinmaydi — faqat umumiy `status` qaytariladi. Bu Kubernetes/load
# balancer liveness probelar uchun yetarli, lekin attacker'ga
# komponent-darajadagi diagnostika bermaydi.
management.endpoint.health.show-details=never
