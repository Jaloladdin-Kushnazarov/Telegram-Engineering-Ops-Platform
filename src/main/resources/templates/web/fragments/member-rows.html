<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="uz">
<body>
<th:block th:fragment="rows">
    <tr th:each="m : ${members}" th:id="|member-row-${m.userId()}|">
        <td>
            <strong th:text="${m.displayName()}">Name</strong>
        </td>
        <td>
            <code th:text="${m.telegramUserId()}">123456</code>
        </td>
        <td th:text="${m.username() != null ? '@' + m.username() : '—'}">@user</td>
        <td>
            <!-- Role change dropdown — HTMX POST on change -->
            <select
                th:hx-post="@{|/web/api/tenants/${tenantId}/members/${m.userId()}/role|}"
                hx-trigger="change"
                hx-target="#member-tbody"
                hx-swap="innerHTML"
                name="newRoleCode"
                class="role-select">
                <option th:each="r : ${assignableRoles}"
                        th:value="${r}"
                        th:text="${r}"
                        th:selected="${r == m.roleCode()}">ENGINEER</option>
            </select>
        </td>
        <td>
            <span th:class="'status-tag status-' + ${#strings.toLowerCase(m.status())}"
                  th:text="${m.status()}">ACTIVE</span>
        </td>
        <td th:text="${m.joinedAt() != null
                   ? #temporals.format(m.joinedAt(), 'yyyy-MM-dd')
                   : ''}">2026-05-10</td>
        <td>
            <button type="button" class="action-button action-danger"
                    th:hx-delete="@{|/web/api/tenants/${tenantId}/members/${m.userId()}|}"
                    hx-target="#member-tbody"
                    hx-swap="innerHTML"
                    hx-confirm="A'zoni rostdan ham o'chirmoqchimisiz?">
                Remove
            </button>
        </td>
    </tr>
    <tr th:if="${count == 0}">
        <td colspan="7" class="empty-state">
            Hech qanday a'zo topilmadi. Yuqoridagi form orqali qo'shing.
        </td>
    </tr>
</th:block>

<th:block th:fragment="inviteError">
    <span th:text="${error}">Error message</span>
</th:block>
</body>
</html>
