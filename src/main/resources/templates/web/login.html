<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="uz">
<body>
    <div th:fragment="content">
        <h1>Login</h1>

        <!-- Phase 218b — Telegram Login Widget. Faqat bot-username
             sozlangan bo'lsa render qilinadi. data-onauth callback
             auth.js'dagi window.onTelegramAuth funksiyasiga ulanadi. -->
        <div th:if="${telegramBotUsername != null and !#strings.isEmpty(telegramBotUsername)}"
             class="telegram-login-container">
            <h3>Telegram orqali kirish</h3>
            <script async
                    src="https://telegram.org/js/telegram-widget.js?22"
                    th:attr="data-telegram-login=${telegramBotUsername},
                             data-size=large,
                             data-onauth='onTelegramAuth(user)',
                             data-request-access=write"></script>
            <p class="login-message" id="login-message"></p>
        </div>

        <p>JWT'ni quyiga joylashtiring va Login tugmasini bosing. JWT
           token avval CI / API tokenidan olinishi kerak.</p>
        <form onsubmit="handleLoginSubmit(event)">
            <label for="jwt-input">JWT token:</label><br>
            <textarea id="jwt-input" rows="6" cols="80" required></textarea><br>
            <button type="submit">Login</button>
        </form>
        <p id="login-message"
           th:unless="${telegramBotUsername != null and !#strings.isEmpty(telegramBotUsername)}"
           class="login-message"></p>
        <button type="button" id="dev-token-button" class="dev-token-button"
                style="display: none;">
            Get dev token (dev mode)
        </button>
        <script>
            function handleLoginSubmit(e) {
                e.preventDefault();
                const jwt = document.getElementById('jwt-input').value.trim();
                if (!jwt) {
                    document.getElementById('login-message').textContent =
                        'JWT bo\'sh bo\'lishi mumkin emas';
                    return;
                }
                window.setJwt(jwt);
                window.location.href = '/web/dashboard';
            }

            // Phase 211: dev mode auto-detection. Production'da
            // /api/dev/auth/info 404 qaytaradi → button yashirinligicha qoladi.
            async function tryEnableDevMode() {
                try {
                    const r = await fetch('/api/dev/auth/info');
                    if (!r.ok) return;
                    const info = await r.json();
                    if (!info.devMode) return;
                    const btn = document.getElementById('dev-token-button');
                    btn.style.display = '';
                    btn.onclick = async () => {
                        const tokenRes = await fetch('/api/dev/auth/bootstrap-admin-token');
                        const data = await tokenRes.json();
                        window.setJwt(data.token);
                        window.setActiveTenant(info.firstTenantId);
                        window.location.href = '/web/dashboard?tenantId=' + info.firstTenantId;
                    };
                } catch (e) { /* dev mode emas, jim yashirinaversin */ }
            }
            document.addEventListener('DOMContentLoaded', tryEnableDevMode);
        </script>
    </div>
</body>
</html>
