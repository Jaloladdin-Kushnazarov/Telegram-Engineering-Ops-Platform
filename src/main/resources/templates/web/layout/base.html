<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} ?: 'Engineering Ops'">Engineering Ops</title>
    <link rel="stylesheet" th:href="@{/web/css/app.css}">
    <script src="https://unpkg.com/htmx.org@2.0.3" defer></script>
    <script th:src="@{/web/js/auth.js}" defer></script>
</head>
<body>
<nav class="topnav">
    <strong>Engineering Ops</strong>
    <div id="tenant-select-wrapper"
         th:hx-get="@{/web/api/tenants/options(activeTenantId=${tenantId})}"
         hx-trigger="load"
         hx-swap="innerHTML">
        <div class="tenant-select-skeleton skeleton-text">···</div>
    </div>
    <div class="nav-links">
        <!-- Phase 212 D2 — tenantId saqlanadi nav'da, null bo'lsa ?tenantId=
             empty param'sini render qilmaslik uchun conditional href. -->
        <a th:href="${tenantId != null} ? @{/web/dashboard(tenantId=${tenantId})} : @{/web/dashboard}"
           th:classappend="${activeNav == 'dashboard' ? 'active' : ''}">Dashboard</a>
        <a th:href="${tenantId != null} ? @{/web/work-items(tenantId=${tenantId})} : @{/web/work-items}"
           th:classappend="${activeNav == 'work-items' ? 'active' : ''}">Work items</a>
        <a th:href="${tenantId != null} ? @{/web/health(tenantId=${tenantId})} : @{/web/health}"
           th:classappend="${activeNav == 'health' ? 'active' : ''}">Health</a>
    </div>
    <div class="topnav-right">
        <a th:href="@{/web/login}" id="login-link" class="nav-action">Login</a>
        <a href="#" id="logout-link" class="nav-action" style="display:none"
           onclick="clearJwt();return false;">Logout</a>
    </div>
</nav>
<main>
    <th:block th:replace="~{__${contentFragment}__}">
        <p>(content here)</p>
    </th:block>
</main>
<footer>
    <small>Engineering Ops Platform &middot; v0.1</small>
</footer>
</body>
</html>
