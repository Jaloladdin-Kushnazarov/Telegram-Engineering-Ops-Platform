<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} ?: 'Engineering Ops'">Engineering Ops</title>
    <link rel="stylesheet" th:href="@{/web/css/app.css}">
    <script src="https://unpkg.com/htmx.org@2.0.3" defer></script>
    <script th:src="@{/web/js/auth.js}" defer></script>
</head>
<body>
<nav class="topnav">
    <strong>Engineering Ops</strong>
    <div id="tenant-select-wrapper"
         th:hx-get="@{/web/api/tenants/options(activeTenantId=${tenantId})}"
         hx-trigger="load"
         hx-swap="innerHTML">
        <div class="tenant-select-skeleton skeleton-text">···</div>
    </div>
    <div class="nav-links">
        <!-- Phase 212 D2 — tenantId saqlanadi nav'da, null bo'lsa ?tenantId=
             empty param'sini render qilmaslik uchun conditional href. -->
        <a th:href="${tenantId != null} ? @{/web/dashboard(tenantId=${tenantId})} : @{/web/dashboard}"
           th:classappend="${activeNav == 'dashboard' ? 'active' : ''}">Dashboard</a>
        <a th:href="${tenantId != null} ? @{/web/work-items(tenantId=${tenantId})} : @{/web/work-items}"
           th:classappend="${activeNav == 'work-items' ? 'active' : ''}">Work items</a>
        <a th:href="${tenantId != null} ? @{/web/health(tenantId=${tenantId})} : @{/web/health}"
           th:classappend="${activeNav == 'health' ? 'active' : ''}">Health</a>
        <!-- Phase 217b — PLATFORM_OWNER nav link. style="display:none;"
             default; auth.js detectPlatformOwner() probe muvaffaqiyatli
             bo'lsa show qiladi. -->
        <a th:href="@{/web/platform/tenants}"
           th:classappend="${activeNav == 'platform' ? 'active' : ''}"
           id="nav-link-platform"
           style="display: none;">Platform</a>
        <!-- Phase 219c — tenant-scoped MEMBER_MANAGE nav link. th:if OLIB
             TASHLANDI: element har sahifada (Platform sahifa tenantId=null
             bo'lsa ham) DOM'da render qilinadi. Server-side: display:none +
             href="#" fallback. auth.js detectMemberManager() tenantId'ni
             URL/localStorage'dan resolve qilib href'ni set qiladi va probe
             muvaffaqiyatli (denied emas) bo'lsa show qiladi. -->
        <a href="#"
           th:href="${tenantId != null} ? @{|/web/tenants/${tenantId}/members|} : '#'"
           th:classappend="${activeNav == 'members' ? 'active' : ''}"
           id="nav-link-members"
           style="display: none;">Members</a>
    </div>
    <div class="topnav-right">
        <a th:href="@{/web/onboarding}" id="onboarding-link" class="nav-action">+ New tenant</a>
        <!-- Phase 218c — joriy foydalanuvchi display name (auth.js updateAuthNav
             tomonidan boshqariladi; localStorage.platform.userDisplayName'dan
             o'qiladi). -->
        <span id="user-display" class="user-display" style="display: none;"></span>
        <a th:href="@{/web/login}" id="login-link" class="nav-action">Login</a>
        <a href="#" id="logout-link" class="nav-action" style="display:none"
           onclick="clearJwt();return false;">Logout</a>
    </div>
</nav>
<main>
    <th:block th:replace="~{__${contentFragment}__}">
        <p>(content here)</p>
    </th:block>
</main>
<footer>
    <small>Engineering Ops Platform &middot; v0.1</small>
</footer>
</body>
</html>
